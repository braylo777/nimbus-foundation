[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Governor + Timelock inheritance chains run large; Arbitrum/Base honour the
# 24_576-byte EIP-170 limit, so keep the check on rather than raising it.
bytecode_hash = "none"

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
base_sepolia = {key = "${BASESCAN_API_KEY}", chain = 84532}
base = {key = "${BASESCAN_API_KEY}", chain = 8453}
arbitrum_sepolia = {key = "${ARBISCAN_API_KEY}", chain = 421614}
arbitrum = {key = "${ARBISCAN_API_KEY}", chain = 42161}
